server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: Reactive E-Commerce API Gateway
    description: Reactive API Gateway for e-commerce microservices
    version: 1.0.0
